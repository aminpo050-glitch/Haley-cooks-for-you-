name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download Game References
        run: |
          mkdir -p $HOME/stardew $HOME/stardew_tmp
          
          URLS=(
            "https://github.com/zan374/StardewValley-ReferenceAssemblies/archive/refs/heads/main.zip"
            "https://github.com/m208/StardewValley-ReferenceAssemblies/archive/refs/heads/main.zip"
            "https://github.com/StardewModders/ReferenceAssemblies/archive/refs/heads/main.zip"
          )

          SUCCESS=0
          for url in "${URLS[@]}"; do
            echo "Attempting download from: $url"
            if curl -f -sSL -o $HOME/refs.zip "$url"; then
              echo "Successfully fetched reference assemblies!"
              SUCCESS=1
              break
            fi
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "Failed to fetch reference assemblies from available mirrors."
            exit 1
          fi

          unzip -q -o $HOME/refs.zip -d $HOME/stardew_tmp
          find $HOME/stardew_tmp -name "*.dll" -exec cp {} $HOME/stardew/ \;

      - name: Build Mod
        run: dotnet build -c Release -p:GamePath="$HOME/stardew"

      - uses: actions/upload-artifact@v4
        with:
          name: HaleyCooksForYou
          path: bin/Release/net6.0/*.dll
          
