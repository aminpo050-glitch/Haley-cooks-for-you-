name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download Game References
        run: git clone --depth 1 https://github.com/Pathoschild/StardewValley-ReferenceAssemblies.git $HOME/stardew

      - name: Build Mod
        run: dotnet build -c Release -p:GamePath="$HOME/stardew"

      - uses: actions/upload-artifact@v4
        with:
          name: HaleyCooksForYou
          path: bin/Release/net6.0/*.dll
          
