name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download Game References
        run: |
          mkdir -p $HOME/stardew_tmp $HOME/stardew
          curl -L -o $HOME/refs.zip https://github.com/smapi-mods/StardewValley-ReferenceAssemblies/archive/refs/heads/main.zip
          unzip -o $HOME/refs.zip -d $HOME/stardew_tmp
          find $HOME/stardew_tmp -name "*.dll" -exec cp {} $HOME/stardew/ \;

      - name: Build Mod
        run: dotnet build -c Release -p:GamePath="$HOME/stardew"

      - uses: actions/upload-artifact@v4
        with:
          name: HaleyCooksForYou
          path: bin/Release/net6.0/*.dll
          
